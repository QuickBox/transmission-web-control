<script>
(function(){var V=["spectre","smoked","reel","defaulted"],v=null,m;
try{v=localStorage.getItem("qb-transmission-variant")}catch(e){}
if(V.indexOf(v)<0){m=document.cookie.match(/(?:^|;\s*)qb_theme=([^;]*)/);try{v=m?decodeURIComponent(m[1]):""}catch(e){v=""}}
document.documentElement.setAttribute("data-qb-variant",V.indexOf(v)<0?"spectre":v);})();
</script>
